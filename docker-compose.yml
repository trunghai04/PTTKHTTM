services:
  db:
    image: postgres:15-alpine
    container_name: text_classification_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: text_classification
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: https://pypi.org/simple
    container_name: text_classification_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/text_classification
      # Google OAuth + Gmail (optional; add your keys to enable Login with Google & Gmail scan)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/app/models:/app/app/models
    command: >
      sh -c "
        if [ ! -f app/models/spam_model.pkl ] || [ ! -f app/models/news_model.pkl ]; then
          echo 'Training models because artifacts are missing...' &&
          python train_model.py;
        fi &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  trainer:
    profiles: ["trainer"]
    build:
      context: ./backend
      dockerfile: Dockerfile.trainer
      args:
        PIP_INDEX_URL: https://pypi.org/simple
    container_name: text_classification_trainer
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/text_classification
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/app/models:/app/app/models
      - ./backend/reports:/app/reports
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        python train_model.py
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: text_classification_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
